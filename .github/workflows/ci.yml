name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test (race)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test -race
        run: go test -race -timeout=300s ./...

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: golangci-lint
        # v7+ is required for golangci-lint v2.x; v6 explicitly rejects
        # any v2 version string with "golangci-lint v2 is not supported".
        uses: golangci/golangci-lint-action@v7
        with:
          # The repo's .golangci.yml uses the v2 schema (version: "2"),
          # so we pin to a known v2.x release matching the version used
          # locally by the pre-commit hook.
          version: v2.12.2
